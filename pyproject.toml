[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiminer"
version = "0.1.0"
description = "AI Alpha Miner: Multi-Agent Quant Factor Discovery System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "typing_extensions",
    "python-dotenv",
    "loguru",
    "numpy",
    "pandas",
    "polars>=0.20.0",
    "matplotlib",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]
swarm = [
    "langchain>=0.1.0",
    "langchain-community",
    "langchain-chroma",
    "langchain-anthropic",
    "langchain-openai",
    "langgraph",
    "chromadb",
    "sentence-transformers",
    "tiktoken",
    "anthropic",
    "openai",
]
qlib = [
    "pyqlib @ git+https://github.com/microsoft/qlib.git",
]
rq = [
    "rqdatac",
]
tui = [
    "textual",
    "textual-plotext",
]
portfolio = [
    "cvxpy>=1.4.0",
    "scipy",
]
web = [
    "fastapi",
    "uvicorn",
    "matplotlib",
    "psutil",
]
all = [
    "aiminer[swarm,qlib,rq,tui,portfolio,web]",
]

[project.scripts]
aiminer = "aiminer.main:main"
aiminer-manager = "aiminer.manager:main"
aiminer-tui = "aiminer.tui:main"
aiminer-api = "aiminer.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiminer", "aiminer.*"]

