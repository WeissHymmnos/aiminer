[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiminer"
version = "0.1.0"
description = "Multi-agent swarm for automated quantitative alpha factor discovery"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "AI Alpha Miner contributors" }]
keywords = ["quant", "alpha", "langgraph", "factor-mining", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime deps live in requirements.txt for now (includes git+qlib).
dynamic = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.urls]
Homepage = "https://github.com/example/aiminer"
Documentation = "https://github.com/example/aiminer/blob/master/instruction.md"

[tool.setuptools]
py-modules = ["manager", "main", "sub_agent", "api", "tui"]

[tool.setuptools.packages.find]
include = ["agents*", "core*", "schemas*", "workflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
