name: Cross-Platform Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v1.0.0)，留空则使用 dev-{sha}'
        required: false
        default: ''
      publish_release:
        description: '是否创建 GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # Stage 0: 解析版本号 — 后续所有阶段共享
  # ============================================================
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            SHOULD_RELEASE="true"
          elif [[ -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
            VERSION="${TAG#v}"
            SHOULD_RELEASE="${{ inputs.publish_release }}"
          else
            TAG="dev-${GITHUB_SHA::7}"
            VERSION="0.0.0-${GITHUB_SHA::7}"
            SHOULD_RELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "解析结果: tag=$TAG, version=$VERSION, release=$SHOULD_RELEASE"

  # ============================================================
  # Stage 0.5: 测试闸门 — 打包前必须通过 hermetic unit
  # ============================================================
  test-gate:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile api.py manager.py core/strategy.py tui.py

      - name: Hermetic unit tests
        run: PYTHONPATH=. pytest tests/unit -m "unit and not external and not native" -q

  # ============================================================
  # Stage 1: 前端构建 (一次构建, 全平台共用)
  # ============================================================
  build-frontend:
    needs: [resolve-version, test-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # Stage 2: 后端 Sidecar 构建 (每平台独立)
  # ============================================================
  build-backend:
    needs: [resolve-version, test-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            ext: ''
          - platform: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # 删除预装的大型工具, 释放 ~15GB
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\MongoDB" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Google" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Firefox" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:AGENT_TOOLSDIRECTORY\Ruby" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:AGENT_TOOLSDIRECTORY\go" -ErrorAction SilentlyContinue
          Get-PSDrive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            polars_plugins/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('polars_plugins/Cargo.lock') }}

      - name: Install Python deps
        shell: bash
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install maturin pyinstaller

      - name: Build polars_plugins (Rust)
        shell: bash
        working-directory: polars_plugins
        run: |
          set -euxo pipefail
          maturin build --release --out ../dist_plugins
          ls -lh ../dist_plugins/
          # 用 python 找 wheel 最稳, 避免 shell glob 在 windows/空目录时失败
          WHEEL=$(python -c "import glob,sys; fs=sorted(glob.glob('../dist_plugins/polars_plugins-*.whl')); print(fs[0] if fs else ''); sys.exit(0 if fs else 1)")
          echo "Installing: $WHEEL"
          pip install --force-reinstall --no-deps "$WHEEL"

      - name: 打包前磁盘状况
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: df -h

      - name: 打包前磁盘状况 (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Get-PSDrive

      - name: Build backend with PyInstaller
        shell: bash
        run: pyinstaller --clean --noconfirm aiminer-backend.spec

      - name: 打包后磁盘状况
        if: always() && matrix.platform != 'windows-latest'
        shell: bash
        run: df -h

      - name: 打包后磁盘状况 (Windows)
        if: always() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: Get-PSDrive

      - name: Rename sidecar binary (Tauri 命名规范)
        shell: bash
        run: |
          mkdir -p sidecar-out
          SRC="dist/aiminer-backend${{ matrix.ext }}"
          DST="sidecar-out/aiminer-backend-${{ matrix.target }}${{ matrix.ext }}"
          cp "$SRC" "$DST"
          ls -lh sidecar-out/

      - name: Upload sidecar
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: sidecar-out/*
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # Stage 3: Tauri 打包 (汇总前端 + 后端, 出安装包)
  # ============================================================
  build-tauri:
    needs: [resolve-version, build-frontend, build-backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\MongoDB" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Google" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Firefox" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:AGENT_TOOLSDIRECTORY\Ruby" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:AGENT_TOOLSDIRECTORY\go" -ErrorAction SilentlyContinue
          Get-PSDrive

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache tauri target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: tauri-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 下载对应平台的 sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: src-tauri/binaries

      - name: 设置 sidecar 可执行权限 (Unix)
        if: matrix.platform != 'windows-latest'
        run: chmod +x src-tauri/binaries/aiminer-backend-*

      - name: Cache packaged market data
        uses: actions/cache@v4
        with:
          path: ~/.qlib/qlib_data
          key: qlib-market-data-v1-${{ runner.os }}-20260424
          restore-keys: |
            qlib-market-data-v1-${{ runner.os }}-

      - name: 准备随包市场数据
        shell: bash
        run: |
          set -euxo pipefail
          if ! python scripts/download_qlib_data.py cn --validate-only; then
            rm -rf "$HOME/.qlib/qlib_data/cn_data"
            python scripts/download_qlib_data.py cn
          fi
          if ! python scripts/download_qlib_data.py us --validate-only; then
            rm -rf "$HOME/.qlib/qlib_data/us_data"
            python scripts/download_qlib_data.py us
          fi

          rm -rf src-tauri/resources/market_data
          mkdir -p src-tauri/resources/market_data/qlib
          cp -a "$HOME/.qlib/qlib_data/cn_data" src-tauri/resources/market_data/qlib/cn_data
          cp -a "$HOME/.qlib/qlib_data/us_data" src-tauri/resources/market_data/qlib/us_data

          if [ -d data/local_futures ]; then
            cp -a data/local_futures src-tauri/resources/market_data/local_futures
          fi

          python scripts/download_qlib_data.py cn --target-dir src-tauri/resources/market_data/qlib/cn_data --validate-only
          python scripts/download_qlib_data.py us --target-dir src-tauri/resources/market_data/qlib/us_data --validate-only
          test -f src-tauri/resources/market_data/qlib/cn_data/calendars/day.txt
          test -f src-tauri/resources/market_data/qlib/us_data/calendars/day.txt
          du -sh src-tauri/resources/market_data

      - name: 安装前端依赖 (Tauri 需要)
        working-directory: frontend
        run: npm ci

      - name: Tauri 构建
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # 不在这里建 release, 留给 Stage 4 统一处理

      - name: 收集安装包
        shell: bash
        run: |
          mkdir -p installers
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \( \
              -name "*.dmg" -o -name "*.app.tar.gz" -o \
              -name "*.msi" -o -name "*.exe" \
            \) -exec cp {} installers/ \;
          fi
          ls -lh installers/
          COUNT=$(find installers -type f | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "No installer artifacts were produced under $BUNDLE_DIR" >&2
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: installers/*
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # Stage 4: Release 发布 (仅 tag push 或手动指定时执行)
  # ============================================================
  publish-release:
    needs: [resolve-version, build-tauri]
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有平台安装包
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - name: 列出待发布文件
        run: |
          ls -lh release-assets/
          COUNT=$(find release-assets -type f | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

      - name: 创建 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: AIMiner ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.resolve-version.outputs.tag, '-') }}
          files: release-assets/*
