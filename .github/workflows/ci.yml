name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Code style and import order check (Ruff)
        run: ruff check --no-cache
      - name: Python syntax compilation check
        run: python -m compileall src/
      - name: Hermetic unit tests
        env:
          OPENAI_API_KEY: mock-openai-key-for-hermetic-ci
          AIMINER_DISABLE_CHROMA: "1"
          AIMINER_COST_BPS: "5.0"
        run: PYTHONPATH=src pytest tests/unit -m "unit and not external and not native" -q

  backend-external:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RQ_TOKEN: ${{ secrets.RQ_TOKEN }}
      RQ_USER: ${{ secrets.RQ_USER }}
      RQ_PASS: ${{ secrets.RQ_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: External tests
        run: PYTHONPATH=src pytest -m "external" -q

  backend-native:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install maturin
      - name: Build polars plugin
        working-directory: polars_plugins
        run: |
          maturin build --release --out ../dist_plugins
          pip install --force-reinstall --no-deps ../dist_plugins/polars_plugins-*.whl
      - name: Native tests
        run: PYTHONPATH=src pytest -m "native" -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Build frontend
        working-directory: frontend
        run: npm run build
