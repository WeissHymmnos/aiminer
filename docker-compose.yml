services:
  aiminer:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiminer:latest
    container_name: aiminer_app
    volumes:
      # Mount data directories for persistence
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
      # Optional: Mount .env if you want to use local secrets
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Overridable environment variables
      - USE_LOCAL_EMBEDDING=false
    # Example command to run the TUI
    # command: python tui.py
    # For background processing:
    # command: python main.py --iterations 5
    stdin_open: true # Allows interactive mode (useful for TUI)
    tty: true
    restart: unless-stopped
