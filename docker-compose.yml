services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiminer:latest
    container_name: aiminer_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1
      - AIMINER_CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173
    restart: unless-stopped

  worker:
    profiles:
      - research
    build:
      context: .
      dockerfile: Dockerfile
    image: aiminer:latest
    container_name: aiminer_worker
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    command: python manager.py --iterations ${AIMINER_ITERATIONS:-5}
    environment:
      - PYTHONUNBUFFERED=1
      - USE_LOCAL_EMBEDDING=false
    restart: "no"

  tui:
    profiles:
      - tui
    build:
      context: .
      dockerfile: Dockerfile
    image: aiminer:latest
    container_name: aiminer_tui
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    command: python tui.py
    environment:
      - PYTHONUNBUFFERED=1
      - USE_LOCAL_EMBEDDING=false
    stdin_open: true
    tty: true
    restart: "no"
