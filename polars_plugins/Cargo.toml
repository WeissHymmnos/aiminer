[package]
name = "polars_plugins"
version = "0.1.0"
edition = "2021"

[lib]
name = "polars_plugins"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "0.48.1", features = ["full"] }
polars-arrow = { version = "0.48.1" }
pyo3 = { version = "0.24", features = ["extension-module"] }
pyo3-polars = { version = "0.21", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
nom = "7.1"
hashbrown = "0.14"
rayon = "1.10"

