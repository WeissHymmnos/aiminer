[pytest]
# 只从 tests/ 目录收集, 排除仓库根目录的 TUI/polars 草稿脚本
testpaths = tests
norecursedirs = .git .venv build dist dist_plugins polars_plugins node_modules frontend src-tauri data results logs

# Marker 选择由 CI 显式控制；默认 hermetic CI 使用:
#   pytest tests/unit -m "unit and not external and not native"
addopts =
    --strict-markers

markers =
    unit: hermetic unit tests that require no live service, credentials, generated data, or compiled local native extension
    integration: hermetic integration tests that may compose multiple local modules but do not require live services
    external: tests that require network, credentials, or an external vendor dependency such as RiceQuant
    native: tests that require compiled native extensions or a local Rust/Polars plugin build

filterwarnings =
    ignore::DeprecationWarning:fastapi.*
